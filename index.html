<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 动态日报 · 总览</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --ink:#1a1d21; --ink2:#5b6470; --ink3:#8b95a3;
    --line:#e4e7ec; --accent:#2f6fed; --accent-soft:#eaf1ff;
    --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
  }
  html[data-theme="dark"]{
    --bg:#0f1216; --card:#171b21; --ink:#e8eaed; --ink2:#a3adba; --ink3:#727d8b;
    --line:#262c35; --accent:#6b9bff; --accent-soft:#1b2537;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);line-height:1.68;font-size:15px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
  .wrap{max-width:820px;margin:0 auto;padding:40px 20px 80px}
  h1{font-size:26px;margin:0 0 8px;letter-spacing:-.01em}
  .sub{color:var(--ink2);margin:0 0 26px;font-size:14px}
  .item{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:18px 20px;
    margin-bottom:12px;box-shadow:var(--shadow);display:block;text-decoration:none;color:inherit;transition:border-color .15s,transform .15s}
  .item:hover{border-color:var(--accent);transform:translateY(-1px)}
  .date{font-size:12px;color:var(--accent);font-weight:700;letter-spacing:.04em}
  .title{font-size:17px;font-weight:600;margin:5px 0 7px}
  .desc{color:var(--ink2);font-size:14px;margin:0}
  .empty{background:var(--card);border:1px dashed var(--line);border-radius:13px;padding:30px;text-align:center;color:var(--ink3)}
  footer{margin-top:26px;padding-top:18px;border-top:1px solid var(--line);color:var(--ink3);font-size:13px}
  button.tbtn{background:var(--card);color:var(--ink2);border:1px solid var(--line);border-radius:7px;
    padding:5px 11px;font-size:13px;cursor:pointer;font-family:inherit;float:right}
  button.tbtn:hover{color:var(--accent);border-color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <button class="tbtn" id="themeBtn" type="button">切换主题</button>
  <h1>AI 动态日报 · 总览</h1>
  <p class="sub">每天 09:00 自动生成。点击任一日期查看完整日报（网页版）。</p>

  <div id="list">
    <a class="item" href="2026-10-13.html">
      <div class="date">2026-10-13 周二</div>
      <div class="title">Meta 发布 Muse Wonder；智谱 GLM-Legal；Codex CLI 守护进程争议</div>
      <p class="desc">Meta 前沿模型主攻个人/专业 Agent（HN 625）；智谱法律垂域模型 HN 545；OpenAI Codex CLI 默认常驻守护进程引反弹（HN 550）；DeepSeek 融资翻倍至约 1000 亿元；Claude 插件生态出现跨 harness 市场（⭐40552）。</p>
    </a>
  </div>

  <footer>日报自动生成，数据来自公开一手与社区来源；未经实测的工具仅作发现与说明。</footer>
</div>
<script>
(function(){
  var root=document.documentElement, saved=null;
  try{saved=localStorage.getItem('ai-digest-theme');}catch(e){}
  if(saved){root.setAttribute('data-theme',saved);}
  else if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches){root.setAttribute('data-theme','dark');}
  document.getElementById('themeBtn').addEventListener('click',function(){
    var n=root.getAttribute('data-theme')==='dark'?'light':'dark';
    root.setAttribute('data-theme',n);
    try{localStorage.setItem('ai-digest-theme',n);}catch(e){}
  });
})();
</script>
</body>
</html>
